<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时光相册 · 我的记忆</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/home.css" />
</head>
<body>

  <!-- ===== 顶部导航 ===== -->
  <header class="topbar">
    <div class="container topbar__inner">
      <a href="index.html" class="topbar__brand">时光相册</a>
      <div class="topbar__right">
        <span id="user-email" class="topbar__email"></span>
        <a href="add.html" class="topbar__add">＋ 添加照片</a>
        <a href="#" id="logout-btn" class="topbar__logout">退出</a>
      </div>
    </div>
  </header>

  <!-- ===== 顶部 Hero ===== -->
  <header class="hero">
    <div class="container hero__inner">
      <h1 class="hero__title">时光相册</h1>
      <p class="hero__subtitle">把走过的路、遇见的人、吃过的饭，都轻轻收进这里。</p>
    </div>
  </header>

  <!-- ===== 相册分类入口 ===== -->
  <main class="container">
    <section class="section">
      <h2 class="section__title">相册</h2>
      <div id="home-categories" class="cat-grid"></div>
    </section>

    <!-- 地图入口 -->
    <section class="section">
      <a href="map.html" class="map-entry hover-lift">
        <div class="map-entry__emoji">🗺️</div>
        <div class="map-entry__text">
          <div class="map-entry__title">旅行地图</div>
          <div class="map-entry__desc">在世界地图上，看看我走过的每一个地方</div>
        </div>
        <div class="map-entry__arrow">→</div>
      </a>
    </section>
  </main>

  <footer class="footer">
    <p>时光相册 · 安静地纪念每一个瞬间</p>
  </footer>

  <script src="lib/supabase/supabase.js"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="data/photos.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/index.js"></script>
</body>
</html>
